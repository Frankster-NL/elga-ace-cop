# mush-cv – laptopversie (sections-view, 4 kolommen)
# Plakken: dashboard bewerken → + (nieuwe view) → ⋮ → YAML bewerken → alles vervangen → Opslaan.
# Kaarten zijn identiek aan mush-cv; alleen de indeling is anders.
title: mush-cv laptop
path: mush-cv-laptop
icon: mdi:heat-pump
type: sections
max_columns: 4
dense_section_placement: true
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: COP (gemeten)
    heading_style: title
  - type: custom:mushroom-legacy-template-card
    entity: sensor.cop_gemeten_gisteren
    primary: '{{ states(entity) if has_value(entity) else ''–'' }}'
    secondary: Gisteren
    icon: mdi:heat-pump
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.cop_gemeten_deze_maand
    primary: '{{ states(entity) if has_value(entity) else ''–'' }}'
    secondary: Deze maand
    icon: mdi:calendar-month
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.cop_gemeten_seizoen
    primary: '{{ states(entity) if has_value(entity) else ''–'' }}'
    secondary: SCOP seizoen
    icon: mdi:calendar-range
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.elga_ace_cop_curve
    primary: '{{ states(entity) if has_value(entity) else ''–'' }}'
    secondary: |
      Verwacht bij {{ states('sensor.remeha_heatpump_outdoor_temperature') | float(0) | round(1) }} °C
    icon: mdi:chart-bell-curve
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Nu
    heading_style: title
    badges:
    - type: entity
      entity: sensor.warmtepomp_power
      show_icon: true
      show_state: true
  - type: custom:mushroom-legacy-template-card
    entity: sensor.elga_ace_cop_cop_momentaan
    primary: |
      {{ '%.2f' | format(states(entity) | float) if has_value(entity) else '–' }}
    secondary: COP nu
    icon: mdi:heat-pump-outline
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.elga_ace_cop_debiet
    primary: '{{ states(entity) | float(0) | round(1) }} L/min'
    secondary: Debiet vloer (7)
    icon: mdi:waves-arrow-right
    layout: vertical
    icon_color: '{{ ''blue'' if states(entity) | float(0) > 1 else ''grey'' }}'
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.elga_ace_cop_warmtepomp_thermisch_vermogen
    primary: '{{ states(entity) | float(0) | round(2) }} kW'
    secondary: WP warmte
    icon: mdi:fire
    layout: vertical
    icon_color: '{{ ''deep-orange'' if states(entity) | float(0) > 0.1 else ''grey'' }}'
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.elga_ace_cop_ketel_thermisch_vermogen
    primary: '{{ states(entity) | float(0) | round(2) }} kW'
    secondary: Ketel warmte
    icon: mdi:water-boiler
    layout: vertical
    icon_color: '{{ ''purple'' if states(entity) | float(0) > 0.1 else ''grey'' }}'
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
    - type: template
      entity: sensor.elga_ace_cop_delta_t_warmtepomp
      icon: mdi:heat-pump
      content: ΔT WP {{ states(entity) | float(0) | round(1) }} K
    - type: template
      entity: sensor.elga_ace_cop_delta_t_ketel
      icon: mdi:water-boiler
      content: ΔT ketel {{ states(entity) | float(0) | round(1) }} K
    - type: template
      entity: sensor.elga_ace_cop_hybride_aandeel_warmtepomp
      icon: mdi:chart-donut
      content: WP-aandeel {{ states(entity) if has_value(entity) else '–' }} %
    - type: template
      entity: binary_sensor.elga_ace_cop_ketellus_actief
      icon: '{{ ''mdi:water-boiler'' if is_state(entity, ''on'') else ''mdi:heat-pump'' }}'
      icon_color: '{{ ''purple'' if is_state(entity, ''on'') else ''green'' }}'
      content: |
        {% if is_state(entity, 'on') %}Ketel bij · {{ states('sensor.elga_ace_cop_debiet_ketellus') | float(0) | round(1) }} L/min{% else %}Alleen warmtepomp{% endif %}
    - type: template
      entity: sensor.elga_ace_cop_totaal_thermisch_vermogen
      icon: mdi:heating-coil
      content: Naar vloer {{ states(entity) | float(0) | round(2) }} kW
    - type: template
      entity: binary_sensor.elga_ace_cop_ontdooien
      icon: mdi:snowflake-melt
      icon_color: '{{ ''cyan'' if is_state(entity, ''on'') else ''grey'' }}'
      content: |
        {% if is_state(entity, 'on') %}Ontdooien{% else %}{{ states('sensor.wp_ontdooicycli_dag') | int(0) }}× ontdooid vandaag{% endif %}
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 2
  cards:
  - type: custom:apexcharts-card
    graph_span: 24h
    update_interval: 1min
    header:
      show: true
      title: COP en vermogen (24 uur)
      show_states: false
    yaxis:
    - id: cop
      min: 0
      max: 8
      decimals: 1
      apex_config:
        title:
          text: COP
    - id: kw
      opposite: true
      min: 0
      decimals: 1
      apex_config:
        title:
          text: kW
    series:
    - entity: sensor.elga_ace_cop_cop_momentaan
      name: COP
      yaxis_id: cop
      type: line
      stroke_width: 1
      color: '#2e7d32'
      group_by:
        func: avg
        duration: 5min
        fill: 'null'
    - entity: sensor.elga_ace_cop_warmtepomp_thermisch_vermogen
      name: WP warmte
      yaxis_id: kw
      type: area
      opacity: 0.25
      stroke_width: 1
      color: '#ef6c00'
      group_by:
        func: avg
        duration: 5min
    - entity: sensor.elga_ace_cop_ketel_thermisch_vermogen
      name: Ketel warmte
      yaxis_id: kw
      type: area
      opacity: 0.25
      stroke_width: 1
      color: '#8e24aa'
      group_by:
        func: avg
        duration: 5min
    - entity: sensor.elga_ace_cop_ontdooi_vermogen
      name: Ontdooien
      yaxis_id: kw
      type: area
      opacity: 0.35
      stroke_width: 1
      color: '#00acc1'
      group_by:
        func: avg
        duration: 5min
    - entity: sensor.warmtepomp_power
      name: WP stroom
      yaxis_id: kw
      type: line
      stroke_width: 1
      color: '#fbc02d'
      transform: return x / 1000;
      group_by:
        func: avg
        duration: 5min
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 2
  cards:
  - type: custom:apexcharts-card
    graph_span: 24h
    update_interval: 1min
    header:
      show: true
      title: Temperaturen en debiet (24 uur)
      show_states: true
      colorize_states: true
    yaxis:
    - id: temp
      decimals: 0
      apex_config:
        title:
          text: °C
    - id: flow
      opposite: true
      min: 0
      decimals: 0
      apex_config:
        title:
          text: L/min
    series:
    - entity: sensor.elga_ace_cop_t1_retour
      name: T1 retour vloer
      yaxis_id: temp
      stroke_width: 1
      color: '#1e88e5'
      group_by:
        func: avg
        duration: 2min
    - entity: sensor.elga_ace_cop_t4_aanvoer_vloer
      name: T4 aanvoer vloer
      yaxis_id: temp
      stroke_width: 2
      color: '#e53935'
      group_by:
        func: avg
        duration: 2min
    - entity: sensor.elga_ace_cop_t2_warmtepomp_uit
      name: T2 naar ketel
      yaxis_id: temp
      stroke_width: 1
      color: '#ef6c00'
      group_by:
        func: avg
        duration: 2min
    - entity: sensor.elga_ace_cop_t3_aanvoer
      name: T3 van ketel
      yaxis_id: temp
      stroke_width: 1
      color: '#8e24aa'
      group_by:
        func: avg
        duration: 2min
    - entity: sensor.buitentemperatuur_gemiddeld_24u
      name: Buiten (24u gem.)
      yaxis_id: temp
      stroke_width: 1
      color: '#90a4ae'
    - entity: sensor.elga_ace_cop_debiet
      name: Debiet vloer (7)
      yaxis_id: flow
      type: area
      opacity: 0.15
      stroke_width: 1
      color: '#00897b'
      group_by:
        func: avg
        duration: 2min
    - entity: sensor.elga_ace_cop_debiet_ketellus
      name: Debiet ketellus (5)
      yaxis_id: flow
      type: area
      opacity: 0.15
      stroke_width: 1
      color: '#ab47bc'
      group_by:
        func: avg
        duration: 2min
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Gemeten vs Remeha
    heading_style: title
  - type: custom:mushroom-legacy-template-card
    entity: sensor.cop_gemeten_gisteren
    primary: '{{ states(entity) if has_value(entity) else ''–'' }}'
    secondary: Gemeten gisteren
    icon: mdi:heat-pump
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.cop_remeha_gisteren
    primary: '{{ states(entity) if has_value(entity) else ''–'' }}'
    secondary: Remeha gisteren
    icon: mdi:cloud-outline
    layout: vertical
    icon_color: |
      {% set c = states(entity) | float(0) %} {{ 'grey' if c == 0 else 'red' if c < 3 else 'orange' if c < 4 else 'green' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.cop_verschil_remeha_gisteren
    primary: |
      {% if has_value(entity) %}{{ '%+.2f' | format(states(entity) | float) }}{% else %}–{% endif %}
    secondary: Verschil
    icon: mdi:delta
    layout: vertical
    icon_color: |
      {% set d = states(entity) | float(0) | abs %} {{ 'grey' if not has_value(entity) else 'green' if d <= 0.3 else 'orange' if d <= 0.8 else 'red' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.warmte_afwijking_remeha_gisteren
    primary: |
      {% if has_value(entity) %}{{ '%+.0f' | format(states(entity) | float) }} %{% else %}–{% endif %}
    secondary: Warmte Remeha
    icon: mdi:fire-alert
    layout: vertical
    icon_color: |
      {% set d = states(entity) | float(0) | abs %} {{ 'grey' if not has_value(entity) else 'green' if d <= 5 else 'orange' if d <= 15 else 'red' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:apexcharts-card
    graph_span: 30d
    span:
      end: day
    header:
      show: true
      title: Dag-COP gemeten vs Remeha
      show_states: false
    all_series_config:
      offset: -1d
      statistics:
        type: mean
        period: day
    yaxis:
    - id: cop
      min: 0
      max: 8
      decimals: 1
      apex_config:
        title:
          text: COP
    - id: pct
      opposite: true
      decimals: 0
      apex_config:
        title:
          text: '% afwijking'
    series:
    - entity: sensor.cop_gemeten_gisteren
      name: Gemeten
      yaxis_id: cop
      type: column
      color: '#2e7d32'
    - entity: sensor.cop_remeha_gisteren
      name: Remeha
      yaxis_id: cop
      type: column
      color: '#90a4ae'
    - entity: sensor.cop_afwijking_remeha_gisteren
      name: Afwijking
      yaxis_id: pct
      type: line
      stroke_width: 2
      color: '#e53935'
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Perioden
    heading_style: title
  - type: entities
    state_color: true
    entities:
    - type: section
      label: Deze maand
    - entity: sensor.cop_gemeten_deze_maand
      name: COP gemeten
    - entity: sensor.cop_remeha_deze_maand
      name: COP Remeha
    - entity: sensor.cop_verschil_remeha_deze_maand
      name: Verschil (Remeha − gemeten)
    - entity: sensor.cop_afwijking_remeha_deze_maand
      name: Afwijking COP
    - entity: sensor.warmte_afwijking_remeha_deze_maand
      name: Afwijking geleverde warmte
    - entity: sensor.stroom_afwijking_remeha_deze_maand
      name: Afwijking stroomverbruik
    - type: section
      label: Stookseizoen
    - entity: sensor.cop_gemeten_seizoen
      name: SCOP gemeten
    - entity: sensor.cop_remeha_seizoen
      name: SCOP Remeha
    - entity: sensor.cop_afwijking_remeha_seizoen
      name: Afwijking SCOP
    - type: section
      label: Ontdooien
    - entity: sensor.ontdooicycli_gisteren
      name: Ontdooicycli gisteren
    - entity: sensor.elga_ace_cop_duur_laatste_ontdooiing
      name: Duur laatste ontdooiing
    - entity: sensor.ontdooiverlies_gisteren
      name: Ontdooiverlies gisteren
    - entity: sensor.ontdooiverlies_deze_maand
      name: Ontdooiverlies deze maand
    - entity: sensor.cop_gemeten_netto_deze_maand
      name: COP netto deze maand (na ontdooien)
    - type: section
      label: Tzerra (gemeten ketelwarmte / P1-gas)
    - entity: sensor.rendement_tzerra_gisteren
      name: Rendement gisteren
    - entity: sensor.rendement_tzerra_deze_maand
      name: Rendement deze maand
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Hybride aandeel
    heading_style: title
  - type: gauge
    entity: sensor.hybride_aandeel_gemeten_gisteren
    name: WP gisteren
    min: 0
    max: 100
    severity:
      green: 80
      yellow: 50
      red: 0
    grid_options:
      columns: 4
  - type: gauge
    entity: sensor.hybride_aandeel_gemeten_deze_maand
    name: WP maand
    min: 0
    max: 100
    severity:
      green: 80
      yellow: 50
      red: 0
    grid_options:
      columns: 4
  - type: gauge
    entity: sensor.hybride_aandeel_gemeten_seizoen
    name: WP seizoen
    min: 0
    max: 100
    severity:
      green: 80
      yellow: 50
      red: 0
    grid_options:
      columns: 4
  - type: custom:apexcharts-card
    graph_span: 30d
    span:
      end: day
    header:
      show: true
      title: Aandeel warmtepomp per dag
      show_states: false
    all_series_config:
      offset: -1d
      statistics:
        type: mean
        period: day
    yaxis:
    - min: 0
      max: 100
      decimals: 0
    series:
    - entity: sensor.hybride_aandeel_gemeten_gisteren
      name: Aandeel WP
      type: area
      color: '#43a047'
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Besparing
    heading_style: title
  - type: custom:mushroom-legacy-template-card
    entity: sensor.besparing_warmtepomp_nu
    primary: |
      {% if has_value(entity) %}€ {{ ('%.2f' | format(states(entity) | float)) | replace('.', ',') }}/u{% else %}–{% endif %}
    secondary: Nu
    icon: mdi:cash-fast
    layout: vertical
    icon_color: |
      {% set v = states(entity) | float(0) %} {{ 'grey' if not has_value(entity) or v == 0 else 'green' if v > 0 else 'red' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.besparing_warmtepomp_vandaag
    primary: |
      {% if has_value(entity) %}€ {{ ('%.2f' | format(states(entity) | float)) | replace('.', ',') }}{% else %}–{% endif %}
    secondary: Vandaag
    icon: mdi:cash
    layout: vertical
    icon_color: |
      {% set v = states(entity) | float(0) %} {{ 'grey' if not has_value(entity) or v == 0 else 'green' if v > 0 else 'red' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.besparing_warmtepomp_deze_maand
    primary: |
      {% if has_value(entity) %}€ {{ ('%.2f' | format(states(entity) | float)) | replace('.', ',') }}{% else %}–{% endif %}
    secondary: Deze maand
    icon: mdi:cash-multiple
    layout: vertical
    icon_color: |
      {% set v = states(entity) | float(0) %} {{ 'grey' if not has_value(entity) or v == 0 else 'green' if v > 0 else 'red' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-legacy-template-card
    entity: sensor.besparing_warmtepomp_seizoen
    primary: |
      {% if has_value(entity) %}€ {{ ('%.2f' | format(states(entity) | float)) | replace('.', ',') }}{% else %}–{% endif %}
    secondary: Seizoen
    icon: mdi:piggy-bank-outline
    layout: vertical
    icon_color: |
      {% set v = states(entity) | float(0) %} {{ 'grey' if not has_value(entity) or v == 0 else 'green' if v > 0 else 'red' }}
    tap_action:
      action: more-info
    grid_options:
      columns: 3
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
    - type: template
      entity: sensor.besparing_warmtepomp_seizoen
      icon: mdi:fire-off
      content: |
        {{ state_attr(entity, 'vermeden_gas_m3') | float(0) | round(0) | int }} m³ gas vermeden
    - type: template
      entity: sensor.besparing_warmtepomp_seizoen
      icon: mdi:flash
      content: |
        {{ state_attr(entity, 'stroom_kwh') | float(0) | round(0) | int }} kWh stroom
    - type: template
      entity: sensor.besparing_warmtepomp_totaal
      icon: mdi:piggy-bank
      content: |
        Totaal € {{ ('%.2f' | format(states(entity) | float(0))) | replace('.', ',') }}
    grid_options:
      columns: full
  - type: custom:apexcharts-card
    experimental:
      color_threshold: true
    graph_span: 30d
    span:
      end: day
    header:
      show: true
      title: Besparing per dag
      show_states: false
    yaxis:
    - decimals: 2
      apex_config:
        title:
          text: EUR
    series:
    - entity: sensor.besparing_warmtepomp_totaal
      name: Besparing
      type: column
      color: '#43a047'
      statistics:
        type: change
        period: day
      color_threshold:
      - value: -1000
        color: '#e53935'
      - value: 0
        color: '#43a047'
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 2
  cards:
  - type: custom:apexcharts-card
    graph_span: 24h
    update_interval: 1min
    header:
      show: true
      title: Besparing en COP (24 uur)
      show_states: false
    yaxis:
    - id: eur
      decimals: 2
      apex_config:
        title:
          text: €/u
    - id: cop
      opposite: true
      min: 0
      max: 8
      decimals: 1
      apex_config:
        title:
          text: COP
    series:
    - entity: sensor.besparing_warmtepomp_nu
      name: Besparing
      yaxis_id: eur
      type: area
      opacity: 0.3
      stroke_width: 1
      color: '#43a047'
      group_by:
        func: avg
        duration: 5min
    - entity: sensor.elga_ace_cop_cop_momentaan
      name: COP
      yaxis_id: cop
      type: line
      stroke_width: 1
      color: '#2e7d32'
      group_by:
        func: avg
        duration: 5min
        fill: 'null'
    grid_options:
      columns: full
  visibility:
  - condition: state
    entity: binary_sensor.elga_ace_cop_status
    state: 'on'
- type: grid
  column_span: 2
  cards:
  - type: custom:apexcharts-card
    graph_span: 30d
    span:
      end: day
    header:
      show: true
      title: Dag-COP vs buitentemperatuur
      show_states: false
    all_series_config:
      offset: -1d
      statistics:
        type: mean
        period: day
    yaxis:
    - id: cop
      min: 0
      max: 8
      decimals: 1
      apex_config:
        title:
          text: COP
    - id: temp
      opposite: true
      decimals: 0
      apex_config:
        title:
          text: °C
    series:
    - entity: sensor.cop_gemeten_gisteren
