        const r = await hass.callWS({type:'recorder/statistics_during_period', start_time:s, period:'hour', statistic_ids:ids, types:['mean','change']});
        const buiten = Object.fromEntries((r[ids[0]]||[]).map(p => [p.start, p.mean]));
