        const m = id => Object.fromEntries((r[id]||[]).map(p => [p.start, p.mean]));
        const [buiten, wp, ketel] = ids.map(m);
        const pts = [];
        for (const t in buiten) {
          const w = ((wp[t] ?? 0) + (ketel[t] ?? 0)) * 1000;
          if (w > 50) pts.push([X(buiten[t]), Math.round(w)]);
        }
        return pts.sort((a, b) => a[0] - b[0]);
    - entity: sensor.elga_ace_cop_totaal_thermisch_vermogen
      name: Fit (W/°C)
      type: line
      stroke_width: 3
      color: '#00acc1'
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const X = T => new Date(end).getTime() - (20 - T) * 864e5;
        const ids = ['sensor.remeha_heatpump_outdoor_temperature','sensor.elga_ace_cop_warmtepomp_thermisch_vermogen','sensor.elga_ace_cop_ketel_thermisch_vermogen'];
        const r = await hass.callWS({type:'recorder/statistics_during_period', start_time:new Date(Math.max(Date.now()-30*864e5, Date.parse('2026-11-17T10:10:00+01:00'))).toISOString(), period:'hour', statistic_ids:ids, types:['mean']});
        const m = id => Object.fromEntries((r[id]||[]).map(p => [p.start, p.mean]));
        const [buiten, wp, ketel] = ids.map(m);
        const xs = [], ys = [];
        for (const t in buiten) {
          const w = ((wp[t] ?? 0) + (ketel[t] ?? 0)) * 1000;
          if (w > 50) { xs.push(buiten[t]); ys.push(w); }
        }
        const n = xs.length; if (n < 10) return [];
        const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
        let sxy = 0, sxx = 0;
        xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
        const b = sxy / sxx, a = my - b * mx;
        const grens = b < 0 ? Math.min(20, -a / b) : 20;
        return [[X(-10), Math.round(a - 10 * b)], [X(grens), Math.max(0, Math.round(a + b * grens))]];
    grid_options:
      columns: full
