- type: grid
  column_span: 2
  cards:
  - type: custom:apexcharts-card
    graph_span: 30d
    span:
      end: day
    update_interval: 1h
    header:
      show: true
      title: Onderbroken bedrijf (pendelen, 10 dagen)
      show_states: false
    yaxis:
    - min: 0
      max: 100
      decimals: 0
      apex_config:
        title:
          text: '% van draai-uren'
    apex_config:
      chart:
        height: 260
      plotOptions:
        bar:
          columnWidth: 80%
      xaxis:
        title:
          text: Buitentemperatuur (°C)
        labels:
          formatter: EVAL:v => { const e = new Date(); e.setHours(23,59,59,999); return Math.round(20 - (e - v) / 864e5) + '°'; }
      tooltip:
        x:
          formatter: EVAL:v => { const e = new Date(); e.setHours(23,59,59,999); return 'Buiten ' + Math.round(20 - (e - v) / 864e5) + ' °C'; }
    experimental:
      color_threshold: true
    series:
    - entity: sensor.warmtepomp_power
      name: Onderbroken
      type: column
      color: '#42a5f5'
      color_threshold:
      - value: 0
        color: '#42a5f5'
      - value: 50
        color: '#ffa726'
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const X = T => new Date(end).getTime() - (20 - T) * 864e5;
        const ids = ['sensor.remeha_heatpump_outdoor_temperature','sensor.warmtepomp_power'];
        const r = await hass.callWS({type:'recorder/statistics_during_period', start_time:new Date(Math.max(Date.now()-10*864e5, Date.parse('2026-11-17T10:10:00+01:00'))).toISOString(), period:'5minute', statistic_ids:ids, types:['mean']});
        const uur = t => Math.floor(t / 36e5);
        const buiten = {}, aan = {}, tot = {};
        for (const p of (r[ids[0]]||[])) (buiten[uur(p.start)] ??= []).push(p.mean);
        for (const p of (r[ids[1]]||[])) { const h = uur(p.start); tot[h] = (tot[h] || 0) + 1; if (p.mean > 150) aan[h] = (aan[h] || 0) + 1; }
        const bins = {};
        for (const h in tot) {
          if (!buiten[h] || tot[h] < 10) continue;
          const f = (aan[h] || 0) / tot[h]; if (f < 0.05) continue;
          const k = Math.round(buiten[h].reduce((a, b) => a + b) / buiten[h].length);
          const b = (bins[k] ??= {n: 0, o: 0}); b.n++; if (f < 0.95) b.o++;
        }
        return Object.keys(bins).map(Number).sort((a, b) => a - b).map(k => [X(k), Math.round(100 * bins[k].o / bins[k].n)]);
    grid_options:
      columns: full
