- type: grid
  column_span: 2
  cards:
  - type: custom:apexcharts-card
    graph_span: 90d
    span:
      end: day
    update_interval: 1h
    header:
      show: true
      title: Warmte vs gewogen graaddagen (90 dagen)
      show_states: false
    yaxis:
    - min: 0
      decimals: 0
      apex_config:
        title:
          text: Warmte per dag (kWh)
    apex_config:
      chart:
        height: 300
      xaxis:
        title:
          text: Gewogen graaddagen
        labels:
          formatter: EVAL:v => { const e = new Date(); e.setHours(23,59,59,999); return Math.round(25 - (e - v) / 864e5); }
      tooltip:
        x:
          formatter: EVAL:v => { const e = new Date(); e.setHours(23,59,59,999); return ((25 - (e - v) / 864e5)).toFixed(1) + ' ggd'; }
      markers:
        size:
        - 4
        - 0
      legend:
        show: true
    series:
    - entity: sensor.verwarming_gisteren
      name: Dag
      type: line
      stroke_width: 0
      color: '#ffa726'
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const X = g => new Date(end).getTime() - (25 - g) * 864e5;
        const ids = ['sensor.gewogen_graaddagen_gisteren','sensor.verwarming_gisteren'];
        const r = await hass.callWS({type:'recorder/statistics_during_period', start_time:new Date(Date.now()-90*864e5).toISOString(), period:'day', statistic_ids:ids, types:['mean']});
        const g = Object.fromEntries((r[ids[0]]||[]).map(p => [p.start, p.mean]));
        const pts = [];
        for (const p of (r[ids[1]]||[])) {
          const x = g[p.start];
          if (x == null || p.mean == null || x > 25) continue;
          pts.push([X(x), +p.mean.toFixed(1)]);
        }
        return pts.sort((a, b) => a[0] - b[0]);
    - entity: sensor.verwarming_gisteren
      name: Fit
      type: line
      stroke_width: 3
      color: '#00acc1'
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const X = g => new Date(end).getTime() - (25 - g) * 864e5;
        const ids = ['sensor.gewogen_graaddagen_gisteren','sensor.verwarming_gisteren'];
        const r = await hass.callWS({type:'recorder/statistics_during_period', start_time:new Date(Date.now()-90*864e5).toISOString(), period:'day', statistic_ids:ids, types:['mean']});
        const g = Object.fromEntries((r[ids[0]]||[]).map(p => [p.start, p.mean]));
        const xs = [], ys = [];
        for (const p of (r[ids[1]]||[])) {
          const x = g[p.start];
          if (x == null || p.mean == null || x < 1 || x > 25) continue;
          xs.push(x); ys.push(p.mean);
        }
        const n = xs.length; if (n < 7) return [];
        const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
        let sxy = 0, sxx = 0;
        xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
        if (sxx === 0) return [];
        const b = sxy / sxx, a = my - b * mx;
        return [0, 25].map(x => [X(x), Math.max(0, +(a + b * x).toFixed(1))]);
    grid_options:
      columns: full
